<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Biblioteca de skills de IA</title>
  <desc id="d">Flujo de cuatro skills: el coordinador encarga el mapa del proceso con semáforos, que se resuelve por la ruta ágil (prompts maestros) o la ruta técnica (fichas de desarrollo) y vuelve al coordinador para consolidar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#172036"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Título -->
  <text x="64" y="96" class="sans" font-size="44" font-weight="700" fill="#F8FAFC">Biblioteca de skills de IA</text>
  <text x="64" y="134" class="sans" font-size="20" fill="#94A3B8">Qué parte de tu trabajo conviene hacer con IA, y cómo dejarla lista</text>

  <!-- Leyenda del semáforo -->
  <g class="sans" font-size="16" fill="#CBD5E1">
    <rect x="924" y="56" width="292" height="104" rx="14" fill="#0F172A" stroke="#334155"/>
    <circle cx="952" cy="84" r="8" fill="#22C55E"/>
    <circle cx="952" cy="108" r="8" fill="#EAB308"/>
    <circle cx="952" cy="132" r="8" fill="#EF4444"/>
    <g class="mono" fill="#F8FAFC" text-anchor="end">
      <text x="1022" y="89">15–20</text>
      <text x="1022" y="113">9–14</text>
      <text x="1022" y="137">0–8</text>
    </g>
    <text x="1034" y="89">Recomendable</text>
    <text x="1034" y="113">Con control humano</text>
    <text x="1034" y="137">No por ahora</text>
  </g>

  <!-- Líneas de consolidación (vuelven al coordinador) -->
  <g fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6">
    <path d="M150,518 H96 V232 H432" marker-end="url(#arrow)"/>
    <path d="M1130,518 H1184 V232 H848" marker-end="url(#arrow)"/>
  </g>
  <text x="80" y="380" class="sans" font-size="14" fill="#64748B" transform="rotate(-90 80 380)" text-anchor="middle">consolida</text>
  <text x="1200" y="380" class="sans" font-size="14" fill="#64748B" transform="rotate(90 1200 380)" text-anchor="middle">consolida</text>

  <!-- Flechas principales -->
  <g fill="none" stroke="#64748B" stroke-width="2.5">
    <path d="M640,274 V312" marker-end="url(#arrow)"/>
    <path d="M590,416 C590,445 330,440 330,462" marker-end="url(#arrow)"/>
    <path d="M690,416 C690,445 950,440 950,462" marker-end="url(#arrow)"/>
  </g>

  <!-- Coordinador -->
  <rect x="440" y="190" width="400" height="84" rx="16" fill="#1E1B4B" stroke="#A78BFA" stroke-width="2"/>
  <text x="640" y="226" class="mono" font-size="20" font-weight="700" fill="#EDE9FE" text-anchor="middle">coordinador-automatizacion-ia</text>
  <text x="640" y="254" class="sans" font-size="15" fill="#C4B5FD" text-anchor="middle">recibe · enruta · consolida · revisa</text>

  <!-- Mapeo -->
  <rect x="440" y="320" width="400" height="96" rx="16" fill="#0C2A3F" stroke="#38BDF8" stroke-width="2"/>
  <text x="640" y="354" class="mono" font-size="20" font-weight="700" fill="#E0F2FE" text-anchor="middle">mapeo-de-procesos</text>
  <text x="640" y="380" class="sans" font-size="15" fill="#7DD3FC" text-anchor="middle">relato del trabajo → mapa con semáforos</text>
  <circle cx="616" cy="400" r="6" fill="#22C55E"/>
  <circle cx="640" cy="400" r="6" fill="#EAB308"/>
  <circle cx="664" cy="400" r="6" fill="#EF4444"/>

  <!-- Ruta ágil -->
  <rect x="150" y="470" width="360" height="96" rx="16" fill="#0B2E24" stroke="#34D399" stroke-width="2"/>
  <text x="330" y="506" class="mono" font-size="20" font-weight="700" fill="#D1FAE5" text-anchor="middle">prompts-maestros</text>
  <text x="330" y="534" class="sans" font-size="15" fill="#6EE7B7" text-anchor="middle">Ruta ágil · prompts para hacerlo hoy</text>

  <!-- Ruta técnica -->
  <rect x="770" y="470" width="360" height="96" rx="16" fill="#33260A" stroke="#FBBF24" stroke-width="2"/>
  <text x="950" y="506" class="mono" font-size="20" font-weight="700" fill="#FEF3C7" text-anchor="middle">fichas-de-desarrollo</text>
  <text x="950" y="534" class="sans" font-size="15" fill="#FCD34D" text-anchor="middle">Ruta técnica · fichas para automatizar</text>

  <!-- Pie -->
  <text x="640" y="612" class="sans" font-size="15" fill="#64748B" text-anchor="middle">4 skills en español · Claude · ChatGPT · Gemini · Copilot · agentes de código</text>
</svg>
